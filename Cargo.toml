[package]
name = "claude-meter"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.105"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
softbuffer = "0.4.8"
tao = "0.37.3"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
toml = "1.2.2"
tray-icon = "0.26.1"
ureq = { version = "3.5.2", features = ["json"] }
windows-registry = "0.100.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
wry = "0.57.3"
